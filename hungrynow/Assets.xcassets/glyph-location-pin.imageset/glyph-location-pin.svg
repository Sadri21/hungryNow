<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="Location">
  <title>HungryNow interface glyph — location pin (rounded tip)</title>
  <!--
    REPLACES `M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z`, which met at a
    CUSP at (12,21). At the 10px the location chip draws it, a cusp under a 2.4
    stroke with a default miter join reads as a spike, and the old markup declared
    no linejoin at all, so it got miter by default — the sharpest option available.

    Two changes, both structural rather than a re-draw:

    1. STRAIGHT TANGENT FLANKS, not curves. This is the geometry the app icon
       already uses (`icon/app-icon-foreground-pin-only.svg`: r-230 circle, tangent
       lines, single tip). The UI glyph was drawn with `s`-curve flanks, so the icon
       and the in-app pin were two different pin shapes. Now one shape at two sizes,
       which is what `apple-hig.md` -> Icons asks for.

    2. AN EXPLICIT 1.5-UNIT TIP ARC, not a rounded linejoin. A round join would
       soften the outer contour only and leaves the inner corner tight; an arc in
       the path rounds the whole tip and survives a stroke-width change.

    Geometry, same construction as the app icon, on the 24 grid:
      Circle       centre (12, 9)   r 7
      Apex         (12, 21)         d = 12 from centre
      Tangency     +/-54.31deg  =>  (6.32, 13.08) / (17.68, 13.08)
      Tip arc      r 1.5, centre (12, 18.43), tangent to both flanks
                   flank tangency (10.78, 19.31) / (13.22, 19.31)
      Counter      r 2.6, concentric
    Outer extent with a 2.4 stroke: x 5.4-18.6, y 0.8-21.1 — the old pin's
    footprint to within a rounding error, so this is a drop-in swap with no
    optical size jump on any of the eight screens that draw it.

    Colour comes from CSS, never a literal — see the GLYPH COLOUR rule in shared.css.
  -->
  <path d="M6.32 13.08A7 7 0 1 1 17.68 13.08L13.22 19.31A1.5 1.5 0 0 1 10.78 19.31Z"/>
  <circle cx="12" cy="9" r="2.6"/>
</svg>
